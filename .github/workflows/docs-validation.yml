name: Documentation validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm required files exist
        run: |
          test -f README.md
          test -f docs/01-discovery-and-mvp.md
          test -f docs/02-solution-architecture.md
          test -f docs/04-data-model.md
          test -f docs/06-governance-security-alm.md
          test -f docs/interview-demo-script.md
      - name: Detect obvious secret patterns
        run: |
          ! grep -RInE '(api[_-]?key|client[_-]?secret|password|connectionstring)[[:space:]]*[:=]' --exclude-dir=.git .